<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Vinoteca Triangle</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --text: #f5f5f5; --negre: #8b1e3f; --blanc: #e6c229; --rosat: #e87a90; --escumos: #5bc0be; --buit: #2c2c2c; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    h2 { text-align: center; font-weight: 600; margin: 8px 0 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; max-width: 400px; margin-inline: auto; }
    .tab { flex: 1; padding: 10px; background: var(--card); border: none; color: #aaa; border-radius: 8px; font-weight: bold; }
    .tab.active { background: #333; color: #fff; border-bottom: 2px solid #d4af37; }
    .vinoteca { background: #0a0a0a; border: 2px solid #333; border-radius: 14px; padding: 14px; max-width: 400px; margin: 0 auto; }
    .display { text-align: center; color: #3b82f6; font-family: monospace; font-size: 18px; font-weight: bold; margin-bottom: 12px; letter-spacing: 2px; }
    .prestatge { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid #2a2a2a; }
    .prestatge-baix { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 14px 20px 4px; }
    .slot { aspect-ratio: 1; border-radius: 50%; background: var(--buit); border: 2px dashed #444; display: flex; align-items: center; justify-content: center; font-size: 11px; text-align: center; padding: 4px; overflow: hidden; }
    .slot.ocupat { border-style: solid; border-color: rgba(255,255,255,0.2); font-weight: 600; }
    .Negre { background: var(--negre); color: #fff; }
    .Blanc { background: var(--blanc); color: #111; }
    .Rosat { background: var(--rosat); color: #111; }
    .Escumós { background: var(--escumos); color: #111; }
    .slot-nom { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.1; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; margin-top: 6px; display: block; text-align: center; box-sizing: border-box; }
    .btn-cam { background: #2563eb; color: #fff; margin-bottom: 12px; }
    .btn-primary { background: #d4af37; color: #000; }
    .btn-danger { background: #8b1e3f; color: #fff; }
    .btn-sec { background: #333; color: #fff; }
    .hist-item { background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #d4af37; max-width: 400px; margin-inline: auto; }
  </style>
</head>
<body>

  <h2>🍷 Vinoteca Triangle</h2>
  <div class="tabs">
    <button class="tab active" onclick="canviarTab('grid', this)">Vinoteca (22)</button>
    <button class="tab" onclick="canviarTab('hist', this)">Històric</button>
  </div>

  <div id="vista-grid">
    <div class="vinoteca">
      <div class="display">17 °C</div>
      <div id="graella">Carregant ampolles...</div>
    </div>
  </div>

  <div id="vista-hist" style="display:none;"><div id="llista-historic"></div></div>

  <!-- Modal Afegir amb Càmera -->
  <div id="modal-afegir" class="modal">
    <div class="modal-content">
      <h3 id="titol-afegir" style="margin-top:0;">Nou vi</h3>
      
      <label class="btn btn-cam" id="lbl-camera">
        📷 Escanejar etiqueta amb càmera
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="processarFoto(this)">
      </label>

      <input type="hidden" id="add-fila">
      <input type="hidden" id="add-col">
      <input type="text" id="add-nom" placeholder="Nom del vi">
      <select id="add-tipus">
        <option value="Negre">Negre</option>
        <option value="Blanc">Blanc</option>
        <option value="Rosat">Rosat</option>
        <option value="Escumós">Escumós</option>
      </select>
      <input type="text" id="add-do" placeholder="D.O.">
      <input type="number" id="add-crianca" placeholder="Criança (mesos)">
      <input type="number" step="0.05" id="add-preu" placeholder="Preu (€)">
      <textarea id="add-comentari" rows="2" placeholder="Comentari / notes..."></textarea>
      <button class="btn btn-primary" onclick="guardarNova()">Desar a la posició</button>
      <button class="btn btn-sec" onclick="tancarModals()">Cancel·lar</button>
    </div>
  </div>

  <!-- Modal Detall -->
  <div id="modal-detall" class="modal">
    <div class="modal-content">
      <h3 id="det-nom" style="margin-top:0;"></h3>
      <p id="det-info" style="color:#ccc; font-size:14px;"></p>
      <hr style="border-color:#333;">
      <label style="font-size:13px;">Nota (0-10):</label>
      <input type="number" step="0.5" max="10" min="0" id="det-nota" placeholder="8.5">
      <label style="font-size:13px;">Comentari / Tast:</label>
      <textarea id="det-comentari" rows="3"></textarea>
      <button class="btn btn-danger" onclick="confirmarBeguda()">🍾 Marcar com a beguda</button>
      <button class="btn btn-sec" onclick="tancarModals()">Tancar</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwRuX_IBly0RpgbN0gueQ8KK6fAUJSlcW-IH38l4dTdNFh3Lexrw00SGWLuwQuHVD9a8A/exec';
    let rowSeleccionada = null;

    window.onload = carregarDades;

    async function carregarDades() {
      const res = await fetch(API_URL);
      const dades = await res.json();
      renderitzar(dades);
    }

    async function enviarAccio(payload) {
      document.getElementById('graella').innerHTML = '<p style="text-align:center;color:#888;">Actualitzant...</p>';
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      const dades = await res.json();
      renderitzar(dades);
    }

    function processarFoto(input) {
      if (!input.files || !input.files[0]) return;
      const lbl = document.getElementById('lbl-camera');
      lbl.innerText = '⏳ Llegint etiqueta amb IA...';

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          // Redimensiona la foto a 1024px per pujar-la en 1 segon
          const canvas = document.createElement('canvas');
          const scale = 1024 / Math.max(img.width, img.height);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

          try {
            const res = await fetch(API_URL, {
              method: 'POST',
              body: JSON.stringify({ accio: 'escanejar', imatgeBase64: base64 })
            });
            const info = await res.json();
            if (info.nom) document.getElementById('add-nom').value = info.nom;
            if (info.tipus) document.getElementById('add-tipus').value = info.tipus;
            if (info.do) document.getElementById('add-do').value = info.do;
            if (info.crianca) document.getElementById('add-crianca').value = info.crianca;
            if (info.comentari) document.getElementById('add-comentari').value = info.comentari;
          } catch (err) {
            alert('No s\'ha pogut llegir l\'etiqueta, omple-ho manualment.');
          }
          lbl.innerHTML = '📷 Tornar a escanejar <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="processarFoto(this)">';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }

    function renderitzar(dades) {
      const contenidor = document.getElementById('graella');
      contenidor.innerHTML = '';
      for (let f = 1; f <= 6; f++) {
        const divFila = document.createElement('div');
        divFila.className = f < 6 ? 'prestatge' : 'prestatge-baix';
        const maxCols = f < 6 ? 4 : 2;
        for (let c = 1; c <= maxCols; c++) {
          const ampolla = dades.estoc.find(a => Number(a.fila) === f && Number(a.columna) === c);
          const slot = document.createElement('div');
          if (ampolla) {
            slot.className = `slot ocupat ${ampolla.tipus || 'Negre'}`;
            slot.innerHTML = `<span class="slot-nom">${ampolla.nom}</span>`;
            slot.onclick = () => obrirDetall(ampolla);
          } else {
            slot.className = 'slot';
            slot.innerHTML = `<span style="color:#666;">F${f}·C${c}</span>`;
            slot.onclick = () => obrirAfegir(f, c);
          }
          divFila.appendChild(slot);
        }
        contenidor.appendChild(divFila);
      }

      const llistaHist = document.getElementById('llista-historic');
      llistaHist.innerHTML = dades.historic.length ? '' : '<p style="text-align:center;color:#777;">Encara no hi ha ampolles a l\'històric.</p>';
      dades.historic.forEach(h => {
        llistaHist.innerHTML += `
          <div class="hist-item">
            <div style="display:flex;justify-content:space-between;">
              <strong>${h[1]}</strong><span style="color:#d4af37;">★ ${h[6] || '-'}</span>
            </div>
            <div style="font-size:12px;color:#aaa;">${h[0]} · ${h[2]} · ${h[3]} · ${h[4] ? h[4] + 'm · ' : ''}${h[5]}€</div>
            ${h[7] ? `<div style="font-size:13px;margin-top:4px;font-style:italic;">"${h[7]}"</div>` : ''}
          </div>`;
      });
    }

    function obrirAfegir(f, c) {
      document.getElementById('add-fila').value = f;
      document.getElementById('add-col').value = c;
      document.getElementById('add-nom').value = '';
      document.getElementById('add-do').value = '';
      document.getElementById('add-crianca').value = '';
      document.getElementById('add-preu').value = '';
      document.getElementById('add-comentari').value = '';
      document.getElementById('titol-afegir').innerText = `Nou vi (F${f} · C${c})`;
      document.getElementById('modal-afegir').style.display = 'flex';
    }

    function guardarNova() {
      const ampolla = {
        fila: document.getElementById('add-fila').value,
        columna: document.getElementById('add-col').value,
        nom: document.getElementById('add-nom').value,
        tipus: document.getElementById('add-tipus').value,
        do: document.getElementById('add-do').value,
        crianca: document.getElementById('add-crianca').value,
        preu: document.getElementById('add-preu').value,
        comentari: document.getElementById('add-comentari').value
      };
      if (!ampolla.nom) return alert('Posa el nom del vi');
      tancarModals();
      enviarAccio({ accio: 'afegir', ampolla: ampolla });
    }

    function obrirDetall(ampolla) {
      rowSeleccionada = ampolla.rowIndex;
      document.getElementById('det-nom').innerText = ampolla.nom;
      document.getElementById('det-info').innerText = `${ampolla.tipus} · ${ampolla.do || ''} · ${ampolla.crianca ? ampolla.crianca + ' mesos · ' : ''}${ampolla.preu || ''}€`;
      document.getElementById('det-nota').value = ampolla.nota || '';
      document.getElementById('det-comentari').value = ampolla.comentari || '';
      document.getElementById('modal-detall').style.display = 'flex';
    }

    function confirmarBeguda() {
      const nota = document.getElementById('det-nota').value;
      const com = document.getElementById('det-comentari').value;
      tancarModals();
      enviarAccio({ accio: 'beure', rowIndex: rowSeleccionada, nota: nota, comentari: com });
    }

    function tancarModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
    function canviarTab(vista, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('vista-grid').style.display = vista === 'grid' ? 'block' : 'none';
      document.getElementById('vista-hist').style.display = vista === 'hist' ? 'block' : 'none';
    }
  </script>
</body>
</html>
